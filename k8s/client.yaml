apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-client
  template:
    metadata:
      labels:
        app: quote-client
    spec:
      containers:
        - name: client
          image: quote-chat-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_SERVER_URL
              value: "http://localhost:3000"
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quote-client
spec:
  type: NodePort
  selector:
    app: quote-client
  ports:
    - port: 5173
      targetPort: 5173
      nodePort: 30173
