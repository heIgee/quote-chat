apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-server
  template:
    metadata:
      labels:
        app: quote-server
    spec:
      containers:
        - name: server
          # IfNotPresent allows Minikube to use the local image
          image: quote-chat-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: quote-server-secrets
          env:
            - name: ATLAS_URL
              value: "mongodb://quote-mongo:27017/quote-chat"
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quote-server
spec:
  type: NodePort
  selector:
    app: quote-server
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
